domains:
  viruses:
    label: "Viruses of Public Health Concern"
    description: "Endemic and epidemic viral pathogens in the African continent"
    taxa:
      - taxon_id: 11620
        name: "Lassa mammarenavirus"
        biocontainment: "BSL-4"
        priority: "high"
      - taxon_id: 186538
        name: "Zaire ebolavirus"
        biocontainment: "BSL-4"
        priority: "high"
      - taxon_id: 11269
        name: "Marburg virus"
        biocontainment: "BSL-4"
        priority: "high"
      - taxon_id: 10244
        name: "Monkeypox virus"
        biocontainment: "BSL-3"
        priority: "high"
      - taxon_id: 11089
        name: "Yellow fever virus"
        biocontainment: "BSL-3"
        priority: "medium"
      - taxon_id: 11588
        name: "Rift Valley fever virus"
        biocontainment: "BSL-3"
        priority: "medium"
      - taxon_id: 11587
        name: "Crimean-Congo hemorrhagic fever orthonairovirus"
        biocontainment: "BSL-4"
        priority: "high"

  amr_bacteria:
    label: "Bacterial Pathogens & Antimicrobial Resistance"
    description: "Clinical and surveillance bacterial isolates profiling resistance genotypes"
    taxa:
      - taxon_id: 666
        name: "Vibrio cholerae"
        biocontainment: "BSL-2"
        priority: "high"
      - taxon_id: 1773
        name: "Mycobacterium tuberculosis"
        biocontainment: "BSL-3"
        priority: "high"
      - taxon_id: 573
        name: "Klebsiella pneumoniae"
        biocontainment: "BSL-2"
        priority: "high"
      - taxon_id: 28901
        name: "Salmonella enterica"
        biocontainment: "BSL-2"
        priority: "high"
      - taxon_id: 1313
        name: "Streptococcus pneumoniae"
        biocontainment: "BSL-2"
        priority: "medium"

  vectors:
    label: "Disease Vectors & Parasites"
    description: "Arthropod disease vectors and eukaryotic parasites endemic to Africa"
    taxa:
      - taxon_id: 7165
        name: "Anopheles gambiae"
        biocontainment: "BSL-1"
        priority: "high"
      - taxon_id: 7159
        name: "Aedes aegypti"
        biocontainment: "BSL-1"
        priority: "medium"
      - taxon_id: 5833
        name: "Plasmodium falciparum"
        biocontainment: "BSL-2"
        priority: "high"
