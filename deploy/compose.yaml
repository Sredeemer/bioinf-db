name: ubuntubio

services:
  # ── UbuntuBio Hub API (Self-Contained: SQLite + FTS5 Search) ──────────────
  server:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: ubuntubio_server
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:////srv/data/ubuntubio.db}
      CAS_URL: ${CAS_URL:-http://52.19.144.208}
      GIT_ROOT_DIR: /srv/data/git
      TMP_STAGING_DIR: /srv/data/tmp
      UBUNTUBIO_DATA_ROOT: /srv/data
      UBUNTUBIO_GIT_ROOT: /srv/data/git
      UBUNTUBIO_TMP_ROOT: /srv/data/tmp
      UBUNTUBIO_LOG_FORMAT: json
      UBUNTUBIO_LOG_LEVEL: INFO
      UBUNTUBIO_API_URL: ${UBUNTUBIO_API_URL:-http://52.19.144.208}
      UBUNTUBIO_WEB_URL: ${UBUNTUBIO_WEB_URL:-https://ubuntu-bio-web.vercel.app}
      UBUNTUBIO_ORCID_CLIENT_ID: ${UBUNTUBIO_ORCID_CLIENT_ID:-APP-0000000000000000}
      UBUNTUBIO_ORCID_CLIENT_SECRET: ${UBUNTUBIO_ORCID_CLIENT_SECRET:-dev_orcid_secret}
      UBUNTUBIO_ORCID_BASE_URL: ${UBUNTUBIO_ORCID_BASE_URL:-https://sandbox.orcid.org}
      UBUNTUBIO_ORCID_TOKEN_URL: ${UBUNTUBIO_ORCID_TOKEN_URL:-https://sandbox.orcid.org/oauth/token}
      UBUNTUBIO_ORCID_AUTHORIZE_URL: ${UBUNTUBIO_ORCID_AUTHORIZE_URL:-https://sandbox.orcid.org/oauth/authorize}
    volumes:
      - ${UBUNTUBIO_DATA_DIR:-./.data}:/srv/data
    ports:
      - "8000:8000"

  # ── Caddy Reverse Proxy & TLS ─────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: ubuntubio_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${UBUNTUBIO_DATA_DIR:-./.data}/caddy_data:/data
      - ${UBUNTUBIO_DATA_DIR:-./.data}/caddy_config:/config
    depends_on:
      - server
